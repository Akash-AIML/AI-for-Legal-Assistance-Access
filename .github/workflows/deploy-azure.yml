name: Deploy Backend to Azure Container Apps

on:
  push:
    branches:
      - main
    paths:
      - 'compliance-ai/backend/**'
      - 'compliance-ai/scripts/**'
      - 'compliance-ai/Dockerfile.backend'
      - 'compliance-ai/pyproject.toml'
      - '.github/workflows/deploy-azure.yml'
  workflow_dispatch:

env:
  AZURE_CONTAINER_APP_NAME: compliance-ai-backend
  RESOURCE_GROUP: compliance-ai-rg
  CONTAINER_REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    name: Build Docker Image & Deploy Azure Container App
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set lower case repository name
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPO_LOWER }}/backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./compliance-ai
          file: ./compliance-ai/Dockerfile.backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Log in to Azure CLI
        uses: azure/login@v2
        if: ${{ env.AZURE_CREDENTIALS != '' }}
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container App
        if: ${{ env.AZURE_CREDENTIALS != '' }}
        run: |
          az extension add --name containerapp --upgrade
          ENV_NAME=$(az containerapp env list --query "[0].name" -o tsv || echo "")
          ENV_RG=$(az containerapp env list --query "[0].resourceGroup" -o tsv || echo "")
          
          if [ -n "$ENV_NAME" ] && [ -n "$ENV_RG" ]; then
            echo "Reusing existing Container App Environment '$ENV_NAME' in resource group '$ENV_RG'"
            az containerapp up \
              --name ${{ env.AZURE_CONTAINER_APP_NAME }} \
              --resource-group "$ENV_RG" \
              --environment "$ENV_NAME" \
              --ingress external \
              --target-port 8000 \
              --image ghcr.io/${{ env.REPO_LOWER }}/backend:latest \
              --env-vars \
                OPENAI_BASE_URL="${{ env.OPENAI_BASE_URL || 'https://integrate.api.nvidia.com/v1' }}" \
                OPENAI_API_KEY="${{ env.OPENAI_API_KEY || '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' }}" \
                OPENAI_CHAT_MODEL="${{ env.OPENAI_CHAT_MODEL || 'openai/gpt-oss-20b' }}" \
                OPENAI_EMBED_MODEL="${{ env.OPENAI_EMBED_MODEL || 'nvidia/llama-nemotron-embed-vl-1b-v2' }}" \
                JWT_SECRET="${{ env.JWT_SECRET || 'change-me-in-prod' }}" \
                LLM_OFFLINE="false"
          else
            az containerapp up \
              --name ${{ env.AZURE_CONTAINER_APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --location centralindia \
              --ingress external \
              --target-port 8000 \
              --image ghcr.io/${{ env.REPO_LOWER }}/backend:latest \
              --env-vars \
                OPENAI_BASE_URL="${{ env.OPENAI_BASE_URL || 'https://integrate.api.nvidia.com/v1' }}" \
                OPENAI_API_KEY="${{ env.OPENAI_API_KEY || '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' }}" \
                OPENAI_CHAT_MODEL="${{ env.OPENAI_CHAT_MODEL || 'openai/gpt-oss-20b' }}" \
                OPENAI_EMBED_MODEL="${{ env.OPENAI_EMBED_MODEL || 'nvidia/llama-nemotron-embed-vl-1b-v2' }}" \
                JWT_SECRET="${{ env.JWT_SECRET || 'change-me-in-prod' }}" \
                LLM_OFFLINE="false"
          fi


