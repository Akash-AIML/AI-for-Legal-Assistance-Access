      <h1>LegalLens AI: Enterprise Compliance & Operations Assistant</h1>
      <p>Traditional Retrieval-Augmented Generation (RAG) systems blindly retrieve context and pass it to an LLM, leading to silent hallucinations, version confusion, and security risks. LegalLens AI solves these problems by prioritizing trustworthiness over always producing an answer. We use a LangGraph-driven Evidence Decision Engine to actively resolve outdated, conflicting, or unauthorized information before deciding whether to ANSWER, CLARIFY, RETRIEVE MORE, or ESCALATE.</p>
      <p>Key features include Structure-Aware Document Ingestion & Section Chunking, Pre-LLM Metadata Resolution to avoid version collisions, and Permission-Aware (RBAC) Retrieval which prevents unauthorized access at the query level. Our hybrid search combines dense semantic embeddings with BM25 keyword matching via Reciprocal Rank Fusion (RRF) for precise legal clause lookups.</p>
    </noscript>
